<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 VioletChat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SockJS и STOMP для WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div id="app">
    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <div class="logo">💜 VioletChat</div>
                    <p class="subtitle">Фиолетовое общение</p>
                </div>

                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Вход</button>
                    <button class="tab-btn" data-tab="register">Регистрация</button>
                </div>

                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <label>Имя пользователя</label>
                        <input type="text" id="loginUsername" placeholder="Введите имя" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                    </div>
                    <button type="submit" class="btn-primary">💜 Войти</button>
                </form>

                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label>Имя пользователя</label>
                        <input type="text" id="regUsername" placeholder="Введите имя" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="Введите email" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="regPassword" placeholder="Минимум 6 символов" required>
                    </div>
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="regFirstName" placeholder="Ваше имя">
                    </div>
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" id="regLastName" placeholder="Ваша фамилия">
                    </div>
                    <button type="submit" class="btn-primary">💜 Зарегистрироваться</button>
                </form>

                <div id="authMessage" class="auth-message" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chatScreen" class="chat-screen" style="display: none;">
        <div class="chat-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="logo-small">💜 VioletChat</div>
                    <button id="logoutBtn" class="btn-icon" title="Выйти">🚪</button>
                </div>

                <div class="user-profile" id="userProfile">
                    <div class="avatar" id="userAvatar">👤</div>
                    <div class="user-info">
                        <div class="username" id="sidebarUsername">User</div>
                        <div class="user-status">
                            <span class="status-dot online"></span> Online
                        </div>
                    </div>
                </div>

                <div class="sidebar-nav">
                    <button class="nav-btn active" data-chat="group">
                        💬 Общий чат
                    </button>
                    <button class="nav-btn" data-chat="private">
                        ✉️ Личные
                    </button>
                </div>

                <div class="user-list">
                    <div class="section-title">
                        👥 Онлайн <span class="online-count" id="onlineCount">0</span>
                    </div>
                    <div id="onlineUsers">
                        <div class="online-user placeholder">
                            <div class="avatar-small">👤</div>
                            <div class="user-name">Загрузка...</div>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="chat-main">
                <div class="chat-header">
                    <div class="chat-title" id="chatTitle">💬 Общий чат</div>
                    <div class="chat-actions">
                            <span id="connectionStatus" class="connection-status">
                                <span class="status-dot online"></span> Подключено
                            </span>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <div id="messagesList" class="messages-list"></div>
                </div>

                <div class="message-input-area">
                    <textarea id="messageInput" placeholder="Введите сообщение..." rows="2"></textarea>
                    <button id="sendMessageBtn" class="btn-send">📤 Отправить</button>
                </div>
            </main>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
